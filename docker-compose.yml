services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartreceipt-api
    ports:
      - "8000:8000"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      TESSERACT_LANGUAGES: eng
      SMARTRECEIPT_AI_PROVIDER: disabled
      SMARTRECEIPT_CORS_ORIGINS: ${SMARTRECEIPT_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - smartreceipt_uploads:/app/backend/uploads
      - smartreceipt_ocr:/app/backend/ocr_ready
      - smartreceipt_data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: smartreceipt-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  smartreceipt_uploads:
  smartreceipt_ocr:
  smartreceipt_data:
