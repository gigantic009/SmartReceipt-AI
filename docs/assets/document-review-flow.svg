<g stroke="#aab8d6" stroke-width="3" fill="none" stroke-linecap="round"><path d="M235 205 H278 M455 205 H498 M675 205 H718 M895 205 H938"/></g>
<g filter="url(#s)" font-family="Arial"><rect x="52" y="133" width="183" height="144" rx="15" fill="white"/><rect x="278" y="133" width="177" height="144" rx="15" fill="white"/><rect x="498" y="133" width="177" height="144" rx="15" fill="white"/><rect x="718" y="133" width="177" height="144" rx="15" fill="white"/><rect x="938" y="133" width="210" height="144" rx="15" fill="white"/></g>
<g font-family="Arial" text-anchor="middle"><g fill="#eaf0ff"><circle cx="143" cy="174" r="22"/><circle cx="366" cy="174" r="22"/><circle cx="586" cy="174" r="22"/><circle cx="806" cy="174" r="22"/><circle cx="1043" cy="174" r="22"/></g><g fill="#5876d9" font-size="20" font-weight="700"><text x="143" y="181">1</text><text x="366" y="181">2</text><text x="586" y="181">3</text><text x="806" y="181">4</text><text x="1043" y="181">5</text></g><g fill="#243249" font-size="14" font-weight="700"><text x="143" y="222">Upload</text><text x="366" y="222">Extract</text><text x="586" y="222">Validate</text><text x="806" y="222">Review</text><text x="1043" y="222">Understand</text></g><g fill="#8491a2" font-size="10"><text x="143" y="244">PDF or image</text><text x="143" y="258">stored locally</text><text x="366" y="244">Embedded text</text><text x="366" y="258">or Tesseract OCR</text><text x="586" y="244">Totals, tax and</text><text x="586" y="258">currency checks</text><text x="806" y="244">Correct uncertain</text><text x="806" y="258">fields yourself</text><text x="1043" y="244">Search, analyze</text><text x="1043" y="258">and export reports</text></g></g>
<text x="52" y="319" font-family="Arial" font-size="11" fill="#718096">Extraction produces candidates—not unquestionable facts. Confirm values against the original document before using them.</text>
